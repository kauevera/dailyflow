services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    environment:
      RAILS_ENV: development
    command: >
      sh -c "bin/rails db:prepare && bin/rails server -b 0.0.0.0"

volumes:
  bundle_cache:
